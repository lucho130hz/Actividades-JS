<body>
    <h1> 5 + 3 = ? </h1>
    <button onclick="Sumar()"> Sumar números </button>

    <script>
        function Sumar() {
            let a = 5;
            let b = 3;
            let resultado = a + b;
            alert("La suma es: " + resultado);
            console.log("El botón fue presionado");
        }
    </script>
