<!DOCTYPE html>
<html>
<head>
    <title> Clase JS 3 </title>
</head>
<body>
    <h1 id="titulo"> Titulo original </h1>
    <button onclick="cambiarTitulo()"> Cambiar titulo </button>

    <script>
        function cambiarTitulo() {
        document.getElementById("titulo").innerText = "Titulo cambiado con JavaScript";
        console.log("El botón fue presionado");
        }
    </script>
</body>
</html>
